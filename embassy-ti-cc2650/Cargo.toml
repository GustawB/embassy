[package]
name = "embassy-ti-cc2650"
version = "0.1.0"
edition = "2024"
links = "driverlib"

[dependencies]
ti-cc2650-pac = { git ="https://github.com/GustawB/ti-cc2650-pac.git", rev ="3ce45c92baed536a68d1a7e333eacc3f35860ee1"}
cty = "0.2.2"
embassy-hal-internal = { version = "0.5.0", path = "../embassy-hal-internal", features = ["cortex-m", "prio-bits-3"] }
embassy-sync = { version = "0.8.0", path = "../embassy-sync" }
critical-section = "1.2"
cortex-m-rt = ">=0.6.15,<0.8"
cortex-m = "0.7.6"
paste = "1.0.15"
static_cell = "2.1.1"
embassy-time-driver = { version = "0.2.2", path = "../embassy-time-driver", features = ["tick-hz-32_768"], optional = true }
embassy-time-queue-utils = { version = "0.3.1", path = "../embassy-time-queue-utils", optional = true }
vcell = { version = "0.1.3", optional = true }

[build-dependencies]
bindgen = { version = "0.72.1" }
cc = "1.2.60"

[features]
default = ["rt"]
## Cortex-M runtime (enabled by default)
rt = ["ti-cc2650-pac/rt"]
full_udma_table= []
defmt = []
ieee = []
time-driver = ["dep:embassy-time-driver", "dep:embassy-time-queue-utils"]
## UART emulated by the Sensor Controller on DIO28 (TX) / DIO29 (RX), used by `debug_print`.
debug-print = ["dep:vcell"]
